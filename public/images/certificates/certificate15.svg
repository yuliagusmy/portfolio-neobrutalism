<svg width="800" height="550" viewBox="0 0 800 550" xmlns="http://www.w3.org/2000/svg" font-family="'Plus Jakarta Sans', 'Space Grotesk', -apple-system, sans-serif">
    <!-- Certificate Background &amp; Double Borders -->
    <rect width="800" height="550" fill="#ffffff" />
    <rect x="15" y="15" width="770" height="520" fill="none" stroke="#000000" stroke-width="5" rx="16" />
    <rect x="25" y="25" width="750" height="500" fill="#faf8ff" stroke="#000000" stroke-width="2" rx="12" />
    
    <!-- Top Decorative Ribbon / Banner -->
    <path d="M 640 25 L 720 25 L 720 180 L 680 155 L 640 180 Z" fill="#f59e0b" stroke="#000000" stroke-width="3" />
    <text x="680" y="65" font-size="11" font-weight="900" text-anchor="middle" fill="#000000" letter-spacing="1">SERTIFIKAT</text>
    <text x="680" y="82" font-size="10" font-weight="900" text-anchor="middle" fill="#000000" letter-spacing="1">KOMPETENSI</text>
    <circle cx="680" cy="115" r="22" fill="#ffffff" stroke="#000000" stroke-width="2" />
    <text x="680" y="120" font-size="10" font-weight="900" text-anchor="middle" fill="#000000">MYSKILL</text>

    <!-- Issuer Logo / Header -->
    <g transform="translate(55, 60)">
      <rect x="0" y="0" width="160" height="36" rx="8" fill="#ffffff" stroke="#000000" stroke-width="2.5" />
      <text x="80" y="23" font-size="13" font-weight="900" text-anchor="middle" fill="#000000" letter-spacing="0.5">MYSKILL</text>
    </g>

    <!-- Credential ID Pill -->
    <g transform="translate(55, 125)">
      <rect x="0" y="0" width="140" height="28" rx="6" fill="#000000" />
      <text x="70" y="19" font-size="11" font-weight="800" text-anchor="middle" fill="#ffffff" font-family="monospace">MS-UIUX-2024</text>
    </g>

    <!-- Recipient Info -->
    <text x="55" y="180" font-size="13" font-weight="700" fill="#666666">Diberikan kepada:</text>
    <text x="55" y="215" font-size="28" font-weight="900" fill="#000000" letter-spacing="-0.5">Yuliagus M. Yunus</text>

    <!-- Statement -->
    <text x="55" y="250" font-size="13" font-weight="600" fill="#666666">Atas kelulusan dan penguasaan kompetensi pada program:</text>
    
    <!-- Course Title Box -->
    <g transform="translate(55, 268)">
      <rect x="0" y="0" width="560" height="65" rx="10" fill="#ffffff" stroke="#000000" stroke-width="2.5" />
      <text x="20" y="38" font-size="18" font-weight="900" fill="#000000">UI/UX Design Fundamentals &amp; Wireframing</text>
    </g>

    <!-- Metadata Section -->
    <g transform="translate(55, 360)">
      <rect x="0" y="0" width="130" height="32" rx="8" fill="#f59e0b" stroke="#000000" stroke-width="2" />
      <text x="65" y="21" font-size="12" font-weight="900" text-anchor="middle" fill="#000000">Level: UI/UX Design</text>

      <text x="150" y="21" font-size="12" font-weight="700" fill="#333333">Diterbitkan: <tspan font-weight="900" fill="#000000">2024</tspan></text>
      <text x="350" y="21" font-size="12" font-weight="700" fill="#333333">Kedaluwarsa: <tspan font-weight="900" fill="#000000">Tanpa Kedaluwarsa</tspan></text>
    </g>

    <!-- Footer Seals &amp; Signatures -->
    <g transform="translate(55, 430)">
      <line x1="0" y1="40" x2="160" y2="40" stroke="#000000" stroke-width="1.5" />
      <text x="0" y="30" font-size="18" font-style="italic" font-family="'Brush Script MT', cursive, sans-serif" fill="#222222">Authorized Signature</text>
      <text x="0" y="58" font-size="11" font-weight="900" fill="#000000">MySkill</text>
      <text x="0" y="72" font-size="10" font-weight="600" fill="#777777">Official Verification Partner</text>
    </g>

    <!-- QR Code Mockup -->
    <g transform="translate(640, 410)">
      <rect x="0" y="0" width="90" height="90" rx="8" fill="#ffffff" stroke="#000000" stroke-width="2" />
      <!-- Stylized QR blocks -->
      <rect x="10" y="10" width="25" height="25" fill="#000000" />
      <rect x="15" y="15" width="15" height="15" fill="#ffffff" />
      <rect x="18" y="18" width="9" height="9" fill="#000000" />
      
      <rect x="55" y="10" width="25" height="25" fill="#000000" />
      <rect x="60" y="15" width="15" height="15" fill="#ffffff" />
      <rect x="63" y="18" width="9" height="9" fill="#000000" />

      <rect x="10" y="55" width="25" height="25" fill="#000000" />
      <rect x="15" y="60" width="15" height="15" fill="#ffffff" />
      <rect x="18" y="63" width="9" height="9" fill="#000000" />

      <rect x="42" y="42" width="10" height="10" fill="#000000" />
      <rect x="58" y="55" width="8" height="8" fill="#000000" />
      <rect x="70" y="68" width="10" height="10" fill="#000000" />
      <rect x="42" y="70" width="8" height="8" fill="#000000" />

      <text x="45" y="105" font-size="8" font-weight="900" text-anchor="middle" fill="#000000">KREDENSIAL SAH</text>
    </g>
  </svg>